name: offline-and-local-postgres
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_USER: test
          POSTGRES_DB: invoice_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U test -d invoice_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INVOICEDESK_TEST_POSTGRES_URL: postgresql+psycopg://test:test-only-password@127.0.0.1:5432/invoice_test
      INVOICEDESK_ENV_FILE: /tmp/unused-invoicedesk-env
      LLM_MODE: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.lock
      - run: .venv/bin/python -m pip check
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python -m ruff check --select E9,F63,F7,F82 invoicedesk migrations tests
      - run: .venv/bin/python -m mypy --follow-imports=silent --ignore-missing-imports invoicedesk/domain/contracts.py invoicedesk/domain/master.py invoicedesk/interfaces/security.py
      - name: Verify migrations on fresh database
        env:
          DATABASE_URL: postgresql+psycopg://test:test-only-password@127.0.0.1:5432/invoice_test
        run: .venv/bin/python -m alembic upgrade head
      - run: cp .env.pilot.example .env.pilot
      - run: docker compose --env-file .env.pilot.example config --no-env-resolution
